name: personal_planner
description: "本地优先、可解释的个人智能日程规划工具。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.13.4

hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
        default: sqlite3
      name:
        windows: winsqlite3
        default: sqlite3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  timezone: ^0.11.1
  flutter_local_notifications: ^22.3.1
  file_selector: ^1.1.0
  intl: ^0.20.3
  crypto: ^3.0.7
  archive: ^4.3.0
  cryptography: ^2.9.0
  sqlite3: ^3.7.0
  fl_chart: ^1.2.0
  ffi: ^2.2.0
  # 备份要定位应用自己的数据库文件。`drift_flutter` 内部就用它解析目录（版本已在
  # pubspec.lock 中锁定为 2.1.6），这里提升为直接依赖以便按同一条规则算出路径。
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 端到端流程测试。随 Flutter SDK 提供，不需要额外下载。
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  fake_async: ^1.3.3

  # MSIX 打包。使用范围约束而不是锁定版本，让 pub 选择与当前 SDK 兼容的版本；
  # 实际版本由 pubspec.lock 固定，可复现性仍由 lock 保证。
  msix: ^3.13.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# MSIX 打包配置（技术设计 Task 20）。
#
# 为什么发布必须用 MSIX：技术设计 §10 只排一次性本地通知，而可靠的通知取消与查询
# 能力依赖 Windows 包身份；仅有 release EXE 时通知行为不可靠。
#
# v1 使用稳定的侧载身份；未来接入 Microsoft Store 时，商店渠道必须使用后台分配的
# identity/publisher，并作为独立发布渠道迁移，不能悄悄覆盖这个身份。
msix_config:
  display_name: 智能日程
  publisher_display_name: Personal Planner
  # 侧载用的稳定身份：3–50 字符，只允许字母数字与 . 和 -。**发布后不可更改**
  # （换身份等于换应用，用户数据不会自动迁移）。
  #
  # 这里刻意**不**写成反向域名（如 com.<域名>.xxx）：那会暗示拥有某个域名，而本应用是个人
  # 侧载、没有域名。上方第 135 行的既有约定也是这个口径——将来上 Microsoft Store 时由商店
  # 后台分配 identity/publisher，并作为独立渠道迁移，不覆盖这个身份。
  identity_name: ShuoZhuang.PersonalPlanner
  # 发布者**必须与签名证书的 Subject 一字不差**（原样拷贝 `$cert.Subject` 的输出）。
  # 换证书时这一行要同步改，否则包装不上。
  publisher: CN=Shuo Zhuang, O=Personal User, C=CN
  # **公钥**证书路径（不含私钥，因此不需要也不该给密码）。msix 用它推导 publisher 并校验
  # 文件存在——也就是说它是"发布者从哪来"的依据。
  #
  # 这里刻意指向 `.cer` 而**不是** `.pfx`：msix 对 `.pfx` 会强制要求 `certificate_password`
  # （源码 `extension == '.pfx' && certificatePassword.isNull` 即抛错），那样密码就不得不
  # 写进会进版本库的 pubspec.yaml。`.cer` 没有这个约束，于是**密码不出现在任何文件里**。
  #
  # 私钥（`personal_planner.pfx`）**刻意放在仓库之外**：这样"私钥不进版本库"不依赖是否记得
  # 写 .gitignore。换机器时两样都要带过去，并把下面两处的绝对路径改掉。
  # 用正斜杠是刻意的——YAML 普通标量里的反斜杠容易与转义混淆，Dart 的 File 两种都认。
  certificate_path: C:/Users/zs200/signing/personal_planner.cer
  # 签名方式：**按指纹从当前用户的证书库选取**，而不是 `/f <pfx> /p <密码>`。
  #
  # 为什么不用更"自包含"的 pfx 方式：本机 msix 自带的 signtool（10.0.19041）对它自己
  # 生成的 CNG 私钥执行 `Store::ImportCertObject()` 会失败（0x80090010 / NTE_PERM）——
  # 密码正确也一样，直接从 shell 调用也一样（两条命令都实测过）。改成按指纹从证书库选取后
  # 即通过：signtool 输出 `The following certificate was selected` 与
  # `Done Adding Additional Store`。**副作用两处，都可接受**：
  #   ① 打包前该证书必须已在**当前用户**的个人证书库中（本机已导入；换机器时先
  #      `Import-PfxCertificate`）；
  #   ② 密码不再出现在任何文件或命令里——这比对 pfx 方式更干净。
  #
  # 指纹不是秘密（私钥才是），因此写在版本库里的这一行没有问题。**换证书时同步改这里**。
  # 若将来换成较新的 Windows SDK 里的 signtool，`/f` 方式更可移植（换机器只要带 pfx 即可），
  # 届时把这一行删掉、改用 `--certificate-path` + `--certificate-password`。
  signtool_options: '/sha1 9E157ECE535D16A224593CA39C084705A4FD3C13 /fd SHA256 /v'
  # 必须与 pubspec.yaml 的 version 对应（MSIX 要求四段式）。
  #
  # **版本只能往上走**：`Add-AppxPackage` 不接受比已安装版本更低的包。本机已安装 `1.0.0.0`
  # （含首帧崩溃修复之前的那一版），因此这一版取 `1.0.1.0`，同时 `version` 提到 `1.0.1+2`。
  msix_version: 1.0.1.0
  output_name: personal_planner_1.0.1_x64
  # 通知点击的**激活器**（A②）。打包应用走的是**清单声明**，不是插件那套
  # `HKCU\Software\Classes\AppUserModelId\<aumid>` 注册表约定——这正是"点通知只把窗口带到
  # 前台、不跳转"的原因之一（实测证据见 `docs/testing/flow-verification.md` 第九节）。
  #
  # **clsid 必须与代码里的 `FlutterWindowsNotificationBackend.activatorGuid` 完全一致**：
  # 一边是清单里 Windows 用来创建激活器的 ID，另一边是插件 `CoRegisterClassObject` 注册的
  # ID，两者不符时 Windows 仍然找不到处理器。有一条例用测试守着这个一致性
  # （`test/platform/windows_notification_activator_config_test.dart`）。
  toast_activator:
    clsid: 7D40D6B0-AC23-4E16-9F0F-21C8AEF635B4
    display_name: 智能日程
  # 构建过程不得静默修改本机的受信任证书库；安装测试单独请求用户授权。
  install_certificate: false

